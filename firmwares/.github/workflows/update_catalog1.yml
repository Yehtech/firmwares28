name: Auto Generate Firmware Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'firmwares/**' # 只有當 firmwares 資料夾內的檔案有變動時才觸發

permissions:
  contents: write # 允許 Action 機器人推播更新後的程式碼回 Repository

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 下載 Repository 程式碼
        uses: actions/checkout@v3

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. 執行 Python 腳本產生 JSON
        run: python generate_catalog.py

      - name: 4. 自動 Commit 並上傳 JSON
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          # 如果 catalog.json 有變動才進行 commit 和 push，避免報錯
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新韌體目錄 catalog.json" && git push)
